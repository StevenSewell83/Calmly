name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so the queue doesn't pile up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9.12.3"

jobs:
  setup:
    name: Install dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pnpm-store: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install (frozen lockfile, ignore native scripts)
        # native better-sqlite3 build is rebuilt per-job that needs it via
        # the desktop postinstall script; keeping setup deterministic.
        run: pnpm install --frozen-lockfile --ignore-scripts

  typecheck:
    # calmly-d0s: gated typecheck. Pre-existing errors are silenced via
    # tools/typecheck-baseline/baseline.json; new errors fail the job.
    name: Typecheck (gated)
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck:gated

  lint:
    name: Lint
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm lint

  format:
    name: Format check
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm format:check

  test:
    name: Unit tests
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
      # better-sqlite3 needs a native build for the desktop workspace tests;
      # let lifecycle scripts run on this job only.
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r test

  e2e:
    name: E2E (Electron, Linux)
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # PREVENT-4: skip the heavy Electron e2e run when a PR only touches
      # docs / beads / ralph / non-code files. Push to main always runs.
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            code:
              - 'desktop/**'
              - 'server/**'
              - 'shared/**'
              - 'tools/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'eslint.config.mjs'
              - '.github/workflows/**'
      - name: Skip e2e (docs/beads-only PR)
        if: github.event_name == 'pull_request' && steps.filter.outputs.code != 'true'
        run: |
          echo "::notice::Docs/beads-only PR — skipping Electron e2e."
          exit 0
      - run: corepack enable
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
      - uses: actions/setup-node@v4
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
      # E2E needs the native better-sqlite3 build (lifecycle scripts on) and
      # the Playwright browser binaries cache. We launch Electron itself, not
      # Chromium, so a full `playwright install` is unnecessary, but a few
      # system libs (libnss3 et al.) are required to render the window under
      # Xvfb on the GitHub-hosted runner.
      - run: pnpm install --frozen-lockfile
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
      - name: Install Electron runtime libs
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libpango-1.0-0 \
            libcairo2 \
            libasound2t64 \
            xvfb
      - name: Build desktop (electron-vite)
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        run: pnpm --filter @calmly/desktop build
      - name: Run Playwright E2E (Xvfb)
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        run: xvfb-run -a pnpm --filter @calmly/desktop test:e2e
      - name: Upload Playwright trace on failure
        if: failure() && (github.event_name != 'pull_request' || steps.filter.outputs.code == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: |
            desktop/e2e-results/**
            desktop/playwright-report/**
          if-no-files-found: ignore
          retention-days: 7

  e2e-core-loop:
    name: E2E core-loop (Electron, Linux)
    needs: [setup, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            code:
              - 'desktop/**'
              - 'server/**'
              - 'shared/**'
              - 'tools/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'eslint.config.mjs'
              - '.github/workflows/**'
      - name: Skip e2e-core-loop (docs/beads-only PR)
        if: github.event_name == 'pull_request' && steps.filter.outputs.code != 'true'
        run: |
          echo "::notice::Docs/beads-only PR — skipping core-loop e2e."
          exit 0
      - run: corepack enable
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
      - uses: actions/setup-node@v4
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
      - name: Install Electron runtime libs
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libpango-1.0-0 \
            libcairo2 \
            libasound2t64 \
            xvfb
      - name: Build desktop (electron-vite)
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        run: pnpm --filter @calmly/desktop build
      - name: Run core-loop Playwright E2E (Xvfb)
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        run: xvfb-run -a pnpm --filter @calmly/desktop exec playwright test e2e/core-loop
      - name: Upload Playwright trace on failure
        if: failure() && (github.event_name != 'pull_request' || steps.filter.outputs.code == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace-core-loop
          path: |
            desktop/e2e-results/**
            desktop/playwright-report/**
          if-no-files-found: ignore
          retention-days: 7

  schema-parity:
    # PREVENT-3: column-level parity check across the three sources of
    # truth (zod schemas, sqlite migrations, pg-migrate migrations).
    # Fast (~1s) so we run unconditionally rather than gating on a
    # paths-filter; the path filter felt like overkill.
    name: Schema parity
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm schema:check

  migration-sweep:
    # calmly-wv9: dedicated, fast-fail gate for the migration
    # version-collision class of bug (two workers independently claiming
    # the same sequential version number — see the bead for the incident).
    # Runs the full migration set through the real runner on a fresh DB
    # plus a static duplicate/gap scan, ahead of the ~10min `test` job so a
    # collision surfaces fast. Doesn't need the native better-sqlite3 build
    # (these tests only use node:sqlite + a type-only better-sqlite3
    # import), so it can install with --ignore-scripts like schema-parity.
    name: Migration sweep (version collisions/gaps)
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          # node:sqlite needs Node >= 22.5; the sweep test refuses to skip
          # in CI, so this job pins 22 rather than env.NODE_VERSION (20).
          node-version: "22"
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: >
          pnpm --filter @calmly/desktop exec vitest run
          src/main/db/__tests__/migration-versions.test.ts
          src/main/db/__tests__/migration-sweep.test.ts

  schema-paths:
    name: Migrations touch shared
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            migrations:
              - 'desktop/src/main/db/migrations/**'
              - 'server/migrations/**'
            shared-model:
              - 'shared/src/model/**'
      - name: Check label override
        id: label
        run: |
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'migrations-only-on-purpose') }}" == "true" ]]; then
            echo "override=true" >> "$GITHUB_OUTPUT"
          else
            echo "override=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Enforce shared model touch
        if: steps.filter.outputs.migrations == 'true' && steps.filter.outputs.shared-model != 'true' && steps.label.outputs.override != 'true'
        run: |
          echo "::error::This PR modifies migrations but not shared/src/model/. Update the matching shared zod schema, or apply the 'migrations-only-on-purpose' label if this is intentional (e.g. backfill / index-only)."
          exit 1
