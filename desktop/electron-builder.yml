# electron-builder configuration — packaging baseline for @calmly/desktop (REL-01).
#
# Linux (AppImage + deb), Windows (REL-03, NSIS), macOS (REL-04), code signing +
# notarization (REL-05), and publish/auto-update config (REL-06) all build on top of
# this file. Icon set (build/icon.png/.icns/.ico) is real brand identity generated by
# scripts/generate-icons.mjs from build/icon.svg (REL-02) — mac icon field is wired
# here even though its target list lands in REL-04.
#
# pnpm + npmRebuild note: electron-builder's default node_modules inclusion walks the
# `dependencies` field of package.json (devDependencies are never shipped) and, with
# npmRebuild left at its default `true`, shells out to @electron/rebuild to rebuild native
# modules (better-sqlite3) against the packaged Electron's ABI as part of `dist`/
# `dist:linux`. This duplicates the desktop `postinstall` rebuild (which targets the local
# dev Electron ABI), but the two don't conflict: postinstall runs once at `pnpm install`
# time for local dev/test, while electron-builder's rebuild runs at package time against
# release/app.asar.unpacked and only affects the packaged artifact. electron-builder 25.x
# resolves pnpm's node_modules/.pnpm symlink layout correctly, so no custom `beforeBuild`
# hook is needed. If a future bump regresses this (native module missing, or a
# NODE_MODULE_VERSION mismatch when the packaged app loads better-sqlite3), the fallback is
# `npmRebuild: false` here plus an explicit `beforeBuild` hook that runs
# `electron-builder install-app-deps` against this package directory.
appId: com.calmly.app
productName: Calmly
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - "!src/**"
  - "!test/**"
  - "!e2e/**"
  - "!scripts/**"
  - "!**/*.map"
  - "!**/*.tsbuildinfo"
asar: true
asarUnpack:
  - "**/*.node"
npmRebuild: true
# REL-05: signing lifecycle hooks (see build/hooks/, and the mac/win comments
# below for the env-var contract each one reads). afterPack always runs and
# logs whether this build will be signed; afterSign only fires when
# electron-builder actually signed something and verifies it did so
# correctly (codesign/spctl/stapler on macOS, Get-AuthenticodeSignature on
# Windows), throwing rather than letting a half-signed artifact through;
# afterAllArtifactBuild logs a final per-artifact signed/unsigned summary.
afterPack: build/hooks/afterPack.mjs
afterSign: build/hooks/afterSign.mjs
afterAllArtifactBuild: build/hooks/afterAllArtifactBuild.mjs
# REL-04: DMG (for humans) + ZIP (required by electron-updater on macOS,
# which cannot apply DMG-packaged updates) targets. hardenedRuntime +
# entitlements are required for a build that can later be signed/notarized
# (REL-05) without repackaging; gatekeeperAssess: false skips a local
# Gatekeeper check that only makes sense for a signed/notarized build (this
# one isn't yet) and would otherwise just fail noisily. `protocols` above
# (schemes: [calmly]) is what actually generates the CFBundleURLTypes entry
# in the built Info.plist — nothing mac-specific needed here for that part.
#
# REL-05 signing/notarization — graceful-skip by construction, not something
# this file has to implement: electron-builder itself only signs when
# CSC_LINK + CSC_KEY_PASSWORD (base64 .p12 + its password) are present in the
# environment, and only notarizes (via `notarize: true` below, calling
# @electron/notarize) when APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD +
# APPLE_TEAM_ID are also present — absent secrets produce an unsigned
# dmg/zip, not a build failure. `notarize: true` is written explicitly here
# (rather than relying on the same-effect default) so the intent reads
# clearly next to the env vars it depends on. Full credential lifecycle
# (how to obtain/renew each secret, exact secret names, verification
# commands) is in docs/RELEASING.md; do not put secret values here or
# anywhere else in the repo. See build/hooks/ for the afterPack/afterSign/
# afterAllArtifactBuild scripts that log the signed/unsigned decision and
# verify a signed build actually passes codesign/spctl/stapler.
mac:
  icon: build/icon.icns
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
# REL-03: Windows installer. NSIS one-click, per-user (no UAC elevation),
# launches the app immediately after install — zero-decision, matching the
# ADHD-first "no friction to first success" posture. Never wipe user task
# data on uninstall (deleteAppDataOnUninstall: false); that's a data-loss
# footgun, not a "clean" reinstall.
#
# REL-05 signing: Authenticode via WIN_CSC_LINK (base64 .p12, falls back to
# CSC_LINK) + WIN_CSC_KEY_PASSWORD (falls back to CSC_KEY_PASSWORD) is the
# chosen path — no extra config needed here, electron-builder reads those env
# vars itself and no-ops (unsigned .exe, no failure) when they're absent. The
# alternative considered was Azure Trusted Signing (`win.signtoolOptions`
# pointing at `@azure/trusted-signing-cli`, no local .p12/HSM needed) — not
# wired here because it requires an Azure subscription + a provisioned
# Trusted Signing resource the project doesn't have yet; it's documented as
# the fallback path in docs/RELEASING.md if a traditional OV/EV Authenticode
# cert turns out to be hard to obtain.
win:
  icon: build/icon.ico
  target: nsis
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  # No custom `include` (build/installer.nsh) for calmly:// registration:
  # electron-builder's NSIS target does not itself write protocol registry
  # keys from the `protocols` stanza below (that auto-registration only
  # applies to the macOS Info.plist / AppX targets). Instead,
  # app.setAsDefaultProtocolClient(PROTOCOL) — called on every startup in
  # deeplink-install.ts — performs the actual HKCU\Software\Classes\calmly
  # registration at runtime. runAfterFinish: true guarantees that call fires
  # immediately after install completes (before the user could plausibly
  # click a magic link), so per-user (HKCU, matching perMachine: false)
  # registration is in place without any custom NSIS script. Revisit only if
  # this bead's manual Windows checklist (docs/RELEASING.md) finds otherwise.
linux:
  target:
    - AppImage
    - deb
  category: Utility
  maintainer: Calmly <hello@calmly.app>
  icon: build/icon.png
  # Defaults (Name/StartupWMClass = productName) already match what we want,
  # but pin them explicitly rather than relying on that inference, and add
  # Comment since desktop/package.json has no `description` field for
  # electron-builder to fall back to.
  desktop:
    Name: Calmly
    Comment: Calm, ADHD-friendly planning — capture, triage, and focus without the overwhelm.
    StartupWMClass: Calmly
# Deep-link registration groundwork (calmly://...) for magic-link auth redemption.
# Windows protocol handling is verified (see win/nsis comment above + the manual
# checklist in docs/RELEASING.md); macOS protocol handler verification happens in REL-04.
protocols:
  - name: Calmly
    schemes:
      - calmly
# REL-06: electron-updater reads latest*.yml from this feed after each
# GitHub Release publish (wired by REL-08's CI job — this repo/owner just
# tells electron-builder where those artifacts + manifest land).
publish:
  provider: github
  owner: stevensewell83
  repo: calmly
