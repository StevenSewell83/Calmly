<!--
  Calmly app icon — hand-authored master source. Derived from the
  MountainClimberIcon glyph in GUI_draft.ts (stone surface + emerald accent,
  soft rounded shape language). This is the single source of truth for the
  app's visual identity: desktop/scripts/generate-icons.mjs rasterizes this
  file into build/icon.png (1024x1024 master) and then derives icon.icns /
  icon.ico from that master. Edit this file to change the icon; never
  hand-edit the generated binaries.
-->
