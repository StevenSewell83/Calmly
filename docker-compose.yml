services:
  postgres:
    image: postgres:16-alpine
    container_name: calmly-postgres
    environment:
      POSTGRES_USER: calmly
      POSTGRES_PASSWORD: calmly
      POSTGRES_DB: calmly
    ports:
      - "5432:5432"
    volumes:
      - calmly_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calmly -d calmly"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: calmly-server
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://calmly:calmly@postgres:5432/calmly
      PORT: "3001"
      HOST: "0.0.0.0"
      EMAIL_SENDER: "console"
      DEV_MAIL_DIR: "/tmp/calmly-mail"
      LOG_LEVEL: "info"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  calmly_postgres_data:
