services:
  postgres:
    image: postgres:16-alpine
    container_name: calmly-postgres
    environment:
      POSTGRES_USER: calmly
      POSTGRES_PASSWORD: calmly
      POSTGRES_DB: calmly
    ports:
      - "5432:5432"
    volumes:
      - calmly_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calmly -d calmly"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  calmly_postgres_data:
